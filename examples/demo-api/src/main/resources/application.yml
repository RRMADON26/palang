server:
  port: 8080

palang:
  idempotency:
    store: memory        # switch to redis: --spring.profiles.active=redis
    ttl: 24h
  rate-limit:
    store: memory
    # The library default is 100 requests/minute — realistic for production.
    # Tuned down and set to refill quickly here on purpose, so the UI (and the
    # curl walkthrough) can trigger and recover from a 429 within seconds
    # instead of making you wait out a full minute mid-demo.
    capacity: 8
    refill-period: 20s
    fail-open: true

logging:
  level:
    com.rrmadon.palang: DEBUG
