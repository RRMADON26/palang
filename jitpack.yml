# JitPack builds release artifacts straight from the git tag.
#
# JDK 21 is not JitPack's default, and without pinning it the build fails on the
# language features this project uses (records, sealed interfaces, pattern matching
# for switch).
#
# Tests are skipped here because JitPack is an artifact builder, not a test
# environment: it has no Redis, so the distributed suite could only skip. CI already
# ran the full suite against a real Redis before this tag existed.
jdk:
  - openjdk21

install:
  - mvn install -DskipTests -B
