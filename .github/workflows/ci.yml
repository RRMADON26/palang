name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      # The Redis suite refuses to skip here (PALANG_REQUIRE_REDIS), so the
      # distributed guarantee is genuinely exercised on every push rather than
      # quietly passing because no Redis was around.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test and verify
        env:
          PALANG_REQUIRE_REDIS: 'true'
        run: ./mvnw -B -T1C verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: ignore
